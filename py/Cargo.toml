[package]
name = "chevalier-py"
version = "0.1.1"
edition = "2024"
description = "Python bindings for chevalier - Agents are just functions"
license = "Apache-2.0"

[lib]
name = "chevalier"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.23.5"
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
tokio = { version = "1.49", features = ["sync", "rt", "macros", "time"] }

# Match the native TypeScript binding's Rust capabilities and package split.
chevalier-core = { package = "chevalier", path = "../rust", features = ["mcp"] }
chevalier-mcp = { path = "../mcp", default-features = false, features = ["client", "server"] }
chevalier-vfs = { path = "../vfs", default-features = false, features = ["tokio", "gateway"] }
chevalier-vfs-hash = { path = "../hash" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pythonize = "0.23"
futures = "0.3"
bytes = "1"
async-trait = "0.1.92"
