name: chevalier-ts

on:
  push:
    paths:
      [
        "ts/**",
        "ts-sandbox/**",
        "rust/**",
        "sandbox/**",
        "vfs/**",
        "hash/**",
        "mcp/**",
        "rust-toolchain.toml",
        ".github/workflows/chevalier-ts.yml",
      ]
  pull_request:
    paths:
      [
        "ts/**",
        "ts-sandbox/**",
        "rust/**",
        "sandbox/**",
        "vfs/**",
        "hash/**",
        "mcp/**",
        "rust-toolchain.toml",
        ".github/workflows/chevalier-ts.yml",
      ]
  workflow_dispatch:

defaults:
  run:
    working-directory: ts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:native:debug && npm run build:ts
      - run: npm test

  sandbox-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:debug

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: macos-15-intel, target: x86_64-apple-darwin }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build native addon
        run: npx napi build --platform --release --target ${{ matrix.target }} --js native.js --dts native.d.ts
      - name: Build TS
        run: npm run build:ts
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ts/*.node

  sandbox-build:
    name: sandbox build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: ts-sandbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: macos-15-intel, target: x86_64-apple-darwin }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build native addon
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-bindings-${{ matrix.target }}
          path: ts-sandbox/*.node

  # publish: gather artifacts + `napi prepublish` to create the per-platform
  # optionalDependencies packages, then `npm publish`. Wired up at release time.
