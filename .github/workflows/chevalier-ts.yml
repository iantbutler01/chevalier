name: chevalier-ts
"on":
  push:
    paths:
      - ts/**
      - ts-sandbox/**
      - rust/**
      - sandbox/**
      - vfs/**
      - hash/**
      - mcp/**
      - rust-toolchain.toml
      - .github/workflows/chevalier-ts.yml
    branches:
      - main
    tags:
      - v*
  pull_request:
    paths:
      - ts/**
      - ts-sandbox/**
      - rust/**
      - sandbox/**
      - vfs/**
      - hash/**
      - mcp/**
      - rust-toolchain.toml
      - .github/workflows/chevalier-ts.yml
  workflow_dispatch: null
defaults:
  run:
    working-directory: ts
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ts
          cache-bin: false
      - run: npm ci
      - run: npm run build:native:debug && npm run build:ts
      - run: npm test
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
  sandbox-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts-sandbox/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ts-sandbox
          cache-bin: false
      - run: npm ci
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: npm run build:debug
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ts
          cache-bin: false
      - run: npm ci
      - name: Build native addon
        run: npx napi build --platform --release --target ${{ matrix.target }} --js native.js --dts native.d.ts
      - name: Build TS
        run: npm run build:ts
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ts/*.node
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
  sandbox-build:
    name: sandbox build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: ts-sandbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts-sandbox/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ts-sandbox
          cache-bin: false
      - run: npm ci
      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y
      - name: Build native addon
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-bindings-${{ matrix.target }}
          path: ts-sandbox/*.node
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
concurrency:
  group: chevalier-ts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
