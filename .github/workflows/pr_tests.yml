name: CI
"on":
  pull_request: null
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch: null
jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-bin: false
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run tests
        working-directory: rust
        run: cargo test --all-features
  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-bin: false
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run clippy
        working-directory: rust
        run: cargo clippy --all-features -- -D warnings
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check
  python-build:
    name: Python Build Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install "maturin[patchelf]"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |-
            py
            py-sandbox
          cache-bin: false
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build Python package
        working-directory: py
        run: maturin build --release
      - name: Build Python sandbox package
        working-directory: py-sandbox
        run: maturin build --release
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
  python-integration:
    name: Python Binding Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node for programmatic execution tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin[patchelf]" mypy pytest pytest-asyncio
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |-
            py
            py-sandbox
          cache-bin: false
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build and install package
        working-directory: py
        run: |
          source ../.venv/bin/activate
          maturin develop
      - name: Build and install sandbox package
        working-directory: py-sandbox
        run: |
          source ../.venv/bin/activate
          maturin develop
      - name: Run integration tests
        run: |
          source .venv/bin/activate
          pytest -v integration_tests/
      - name: Verify Python stubs against extensions
        run: |
          source .venv/bin/activate
          python -m mypy.stubtest chevalier --ignore-missing-stub --allowlist py/stubtest_allowlist.txt
          python -m mypy.stubtest chevalier_sandbox --ignore-missing-stub --allowlist py-sandbox/stubtest_allowlist.txt
          python -m mypy --strict integration_tests/typecheck/python_response_contract.py
concurrency:
  group: chevalier-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
