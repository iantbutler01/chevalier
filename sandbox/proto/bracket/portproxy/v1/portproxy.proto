// @dive-file: Portproxy gRPC contract for guest-side file, exec, shell, and daemon attachment services.
// @dive-rel: Generated by portproxy/build.rs and vmd/build.rs for guest runtime and node-local client use.
// @dive-rel: Defines streaming/daemon attach semantics used by distributed exec producer rebind paths.
syntax = "proto3";

package bracket.portproxy.v1;
option go_package = "github.com/BracketDevelopers/OpenBracket/proto/bracket/portproxy/v1;portproxyv1";

import "google/protobuf/empty.proto";

service PortProxy {
  rpc PrepareShutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (google.protobuf.Empty);
  rpc WriteFileStream(stream WriteFileStreamRequest) returns (google.protobuf.Empty);
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  rpc DeletePath(DeletePathRequest) returns (google.protobuf.Empty);
}

service ShellExec {
  rpc ControlExec(ExecControlRequest) returns (google.protobuf.Empty);
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  rpc InteractiveShell(stream InteractiveShellRequest)
      returns (stream InteractiveShellResponse);
}

service DaemonManager {
  rpc ControlDaemon(ExecControlRequest) returns (google.protobuf.Empty);
  rpc ExecDaemon(ExecDaemonRequest) returns (ExecDaemonResponse);
  rpc AttachDaemon(stream AttachDaemonRequest)
      returns (stream AttachDaemonResponse);
}

message ExecDaemonRequest {
  string name = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  optional int32 timeout = 4;
  bool detach = 5;
}

message ExecDaemonResponse { bool is_new = 1; }

message AttachDaemonRequest {
  oneof request {
    AttachDaemonStart start = 1;
    bytes stdin_data = 2;
    bool stdin_eof = 3;
  }
}

message AttachDaemonStart { string name = 1; }

message AttachDaemonResponse {
  oneof response {
    bytes stdout_data = 1;
    bytes stderr_data = 2;
    int32 exit_code = 3;
  }
}

message ExecRequest {
  oneof request {
    ExecStart start = 1;
    bytes stdin_data = 2;
    bool stdin_eof = 3;
  }
}

message ExecStart {
  repeated string args = 1;
  map<string, string> env = 2;
  bool detach = 3;
  optional int32 timeout = 4;
  string execution_id = 5;
}

message ExecControlRequest {
  string execution_id = 1;
  uint64 producer_epoch = 4;
  uint64 control_seq = 5;
  oneof control {
    int32 signal = 2;
    bool stdin_eof = 3;
    bool claim = 6;
  }
}

message ExecResponse {
  oneof response {
    bytes stdout_data = 1;
    bytes stderr_data = 2;
    int32 exit_code = 3;
  }
}

message InteractiveShellRequest {
  oneof request {
    InteractiveShellStart start = 1;
    bytes stdin_data = 2;
    InteractiveShellResize resize = 3;
  }
}

message InteractiveShellStart {
  string shell = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string cwd = 4;
}

message InteractiveShellResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message InteractiveShellResponse {
  oneof response {
    bytes output_data = 1;
    int32 exit_code = 2;
  }
}

message ReadFileRequest {
  string path = 1;
}

message ReadFileResponse {
  bytes data = 1;
}

message WriteFileRequest {
  string path = 1;
  bytes data = 2;
  bool create_parents = 3;
}

message WriteFileStreamRequest {
  oneof request {
    WriteFileStreamStart start = 1;
    bytes data = 2;
  }
}

message WriteFileStreamStart {
  string path = 1;
  bool create_parents = 2;
  uint64 expected_bytes = 3;
  optional uint32 mode = 4;
}

message ListDirectoryRequest {
  string path = 1;
}

message DirectoryEntry {
  string name = 1;
  bool is_dir = 2;
  bool is_symlink = 3;
}

message ListDirectoryResponse {
  repeated DirectoryEntry entries = 1;
}

message DeletePathRequest {
  string path = 1;
}
